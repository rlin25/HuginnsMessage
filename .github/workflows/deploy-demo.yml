name: Deploy Huginn v2 Demo

on:
  push:
    branches: [master]
    paths: [huginn_v2_demo/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: huginn_v2_demo

      - id: deployment
        uses: actions/deploy-pages@v4
